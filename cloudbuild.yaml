steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/storvex:$COMMIT_SHA', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/storvex:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - storvex
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/storvex:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,GCS_MIRROR_BUCKET=${_BUCKET}
      - --startup-probe=httpGet.path=/api/health,initialDelaySeconds=10,periodSeconds=10,timeoutSeconds=5,failureThreshold=6
      - --memory=1Gi
      - --cpu=1
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/storvex:$COMMIT_SHA'
substitutions:
  _REGION: asia-south1
  _REPOSITORY: storvex
  _BUCKET: storvex-disaster-recovery
options:
  logging: CLOUD_LOGGING_ONLY
