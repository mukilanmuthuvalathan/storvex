services:
  storvex:
    build: .
    container_name: storvex-gateway
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PORT: 8080
      STORVEX_STORAGE_MODE: http
      STORVEX_STORAGE_BASE_PORT: 9100
      STORVEX_DATA_DIR: /app/data
      REPAIR_INTERVAL_MS: 15000
    ports:
      - "127.0.0.1:${STORVEX_HOST_PORT:-8080}:8080"
    volumes:
      - "${STORVEX_DATA_MOUNT:-storvex-data}:/app/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  storvex-data:
    name: ${STORVEX_VOLUME_NAME:-promptathon-project_vault-data}
